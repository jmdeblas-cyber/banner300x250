  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      overflow: hidden;
    }

    #banner {
      position: relative;
      width: 350px;
      height: 250px;
      overflow: hidden;
      cursor: pointer;
      font-family: 'CircularStd', Arial, sans-serif;
      background: #000;
    }

    .click-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
    }

    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: imageZoom 9s ease-in-out infinite;
      transform-origin: center center;
    }

    .lime-sweep {
      position: absolute;
      inset: 0;
      background: #D6FB4F;
      transform: translateX(100%);
      animation: limeSweep 9s ease-in-out infinite;
      will-change: transform;
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 350px;
      height: 250px;
      z-index: 3;
      pointer-events: none;
    }

    .logo {
      position: absolute;
      top: 15px;
      left: 12px;
      width: 65.82px;
      height: 15.5px;
      z-index: 6;
      pointer-events: none;
    }

    .text-block {
      position: absolute;
      left: 24px;
      bottom: 65px;
      width: 240px;
      z-index: 6;
      pointer-events: none;
    }

    .text-block svg {
      display: block;
      opacity: 0;
      will-change: transform, opacity;
    }

    .text-1 svg + svg { margin-top: -4px; }
    .text-2 svg + svg { margin-top: 1px; }

    .text-1 .line-1 { animation: text1Line1 9s ease-in-out infinite; }
    .text-1 .line-2 { animation: text1Line2 9s ease-in-out infinite; }

    .text-2 .line-1 { animation: text2Line1 9s ease-in-out infinite; }
    .text-2 .line-2 { animation: text2Line2 9s ease-in-out infinite; }
    .text-2 .line-3 { animation: text2Line3 9s ease-in-out infinite; }

    .cta {
      position: absolute;
      right: 13px;
      bottom: 11px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 0;
      pointer-events: none;
    }

    .cta-photo { opacity: 1; animation: ctaPhoto 9s ease-in-out infinite; }
    .cta-lime { opacity: 0; animation: ctaLime 9s ease-in-out infinite; }

    .cta-icon,
    .cta-pill {
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), background-color 0.3s ease;
      background: #D6FB4F;
    }

    .cta-icon {
      width: 31px;
      border-radius: 50%;
    }

    .cta-pill {
      padding: 0 16px;
      border-radius: 999px;
      margin-left: -4px;
      display: grid;
      place-items: center;
    }

    .cta-arrow {
      width: 16px;
      height: 16px;
      fill: #2B2B2B;
    }

    .cta-text {
      width: 58px;
      height: auto;
      display: block;
      grid-area: 1 / 1;
    }

    .cta-text--light {
      opacity: 0;
    }

    .cta-text--dark {
      opacity: 1;
    }

    .cta-photo .cta-text--light { opacity: 0; }
    .cta-photo .cta-text--dark { opacity: 1; }

    .cta-lime .cta-icon,
    .cta-lime .cta-pill { background: #698BFF; }
    .cta-lime .cta-arrow { fill: #FFFDFA; }
    .cta-lime .cta-text--light { opacity: 1; }
    .cta-lime .cta-text--dark { opacity: 0; }

    #banner:hover .cta-icon {
      transform: translateX(-3px);
      background: #698BFF !important;
    }
    #banner:hover .cta-pill {
      transform: translateX(3px);
      background: #698BFF !important;
    }
    #banner:hover .cta-text--light {
      opacity: 1 !important;
    }
    #banner:hover .cta-text--dark {
      opacity: 0 !important;
    }
    #banner:hover .cta-arrow {
      fill: #FFFDFA !important;
    }

    .disclaimer {
      position: absolute;
      left: 21px;
      top: 212px;
      width: 154px;
      height: 28px;
      z-index: 6;
      pointer-events: none;
    }

    .disclaimer-dark {
      color: #2B2B2B;
      opacity: 0;
      animation: disclaimerDark 9s ease-in-out infinite;
    }

    .disclaimer-light {
      color: #FFFDFA;
      animation: disclaimerLight 9s ease-in-out infinite;
    }

    @keyframes limeSweep {
      0%, 45% { transform: translateX(100%); }
      50% { transform: translateX(0); }
      88% { transform: translateX(0); }
      92% { transform: translateX(-100%); }
      92.01%, 100% { transform: translateX(100%); }
    }

    @keyframes imageZoom {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(0.6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes text1Line1 {
      0%, 4% { opacity: 0; transform: translateY(10px); }
      10% { opacity: 1; transform: translateY(0); }
      45% { opacity: 1; transform: translateY(0) scale(1.02); }
      50%, 100% { opacity: 0; transform: translateX(-40px) scale(1.02); }
    }

    @keyframes text1Line2 {
      0%, 6% { opacity: 0; transform: translateY(10px); }
      12% { opacity: 1; transform: translateY(0); }
      45% { opacity: 1; transform: translateY(0) scale(1.02); }
      50%, 100% { opacity: 0; transform: translateX(-40px) scale(1.02); }
    }

    @keyframes text2Line1 {
      0%, 52% { opacity: 0; transform: translateY(10px); }
      60% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0) scale(1.02); }
      90%, 100% { opacity: 0; transform: translateX(-40px) scale(1.02); }
    }

    @keyframes text2Line2 {
      0%, 56% { opacity: 0; transform: translateY(10px); }
      64% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0) scale(1.02); }
      90%, 100% { opacity: 0; transform: translateX(-40px) scale(1.02); }
    }

    @keyframes text2Line3 {
      0%, 60% { opacity: 0; transform: translateY(10px); }
      68% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0) scale(1.02); }
      90%, 100% { opacity: 0; transform: translateX(-40px) scale(1.02); }
    }

    @keyframes disclaimerDark {
      0%, 45% { opacity: 0; }
      50% { opacity: 1; }

    }

    @keyframes disclaimerLight {
